
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz ♡</title>

<style>
:root {
    --bg-base:#f5f2fa;
    --bg-grad-1:#e3dcf3;
    --bg-grad-2:#dad3ea;
    --text-main:#4a3f60;
    --text-heading:#59467a;
    --accent-border:#9882bd;
    --accent-soft:#f0e9f9;
    --ornament-color:#9379b8;
}

* {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body {
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
    overflow-x:hidden;
}

body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 18px;
    background:
        radial-gradient(circle at 10% 12%,var(--bg-grad-1) 0,transparent 28%),
        radial-gradient(circle at 90% 85%,var(--bg-grad-2) 0,transparent 30%),
        var(--bg-base);
    color:var(--text-main);
    font-family:Georgia,"Times New Roman",serif;
}

.decorations {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-1;
    pointer-events:none;
    overflow:hidden;
}

.decorations span {
    position:absolute;
    color:var(--ornament-color);
    opacity:.4;
    animation:float 5s ease-in-out infinite;
}

.decorations span:nth-child(1) {
    top:10%;left:7%;font-size:20px;
}
.decorations span:nth-child(2) {
    top:25%;right:8%;font-size:13px;animation-delay:1s;
}
.decorations span:nth-child(3) {
    top:52%;left:5%;font-size:14px;animation-delay:2s;
}
.decorations span:nth-child(4) {
    top:68%;right:6%;font-size:21px;animation-delay:1.5s;
}
.decorations span:nth-child(5) {
    bottom:12%;left:12%;font-size:12px;animation-delay:.5s;
}
.decorations span:nth-child(6) {
    bottom:20%;right:13%;font-size:16px;animation-delay:2.5s;
}

.container {
    width:100%;
    max-width:510px;
    padding:28px 23px;
    background:rgba(255,255,255,.78);
    border:1px solid var(--bg-grad-2);
    border-radius:15px;
    box-shadow:0 6px 20px rgba(0,0,0,.045);
    backdrop-filter:blur(8px);
    text-align:center;
}

.ornament {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:22px;
    margin-bottom:24px;
    color:var(--ornament-color);
}

.ornament span {
    font-size:16px;
}

.ornament i {
    width:38px;
    height:1px;
    background:var(--ornament-color);
    opacity:.45;
}

.ornament.bottom {
    margin-top:27px;
    margin-bottom:0;
}

.question {
    color:var(--text-heading);
    font-size:22px;
    font-weight:normal;
    line-height:1.5;
    margin:0 0 25px;
    white-space:pre-wrap;
}

.answers {
    display:flex;
    flex-direction:column;
    gap:11px;
}

.answer {
    width:100%;
    min-height:49px;
    padding:12px 15px;
    border:1px solid var(--accent-border);
    border-radius:11px;
    background:rgba(255,255,255,.8);
    color:var(--text-heading);
    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
    cursor:pointer;
    transition:background .2s,border .2s,transform .15s;
}

.answer:hover:not(:disabled) {
    background:var(--accent-soft);
    transform:translateY(-2px);
}

.answer:disabled {
    cursor:default;
    opacity:1;
}

.answer.correct {
    background:#dceede;
    border-color:#82bd8b;
    color:#467a4c;
}

.answer.wrong {
    background:#f2d7dd;
    border-color:#d88b9d;
    color:#a54e62;
    animation:shake .35s ease;
}

.next {
    display:none;
    margin:20px auto 0;
    padding:11px 27px;
    border:1px solid var(--accent-border);
    border-radius:100px;
    background:var(--accent-soft);
    color:var(--text-heading);
    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}

.next:hover {
    background:#e3d8f3;
    transform:translateY(-2px);
}

.result {
    display:none;
    animation:appear .5s ease;
}

.result h2 {
    color:var(--text-heading);
    font-weight:normal;
    font-size:26px;
    line-height:1.5;
    margin:22px 0;
}

@keyframes float {
    0%,100% {transform:translateY(0) rotate(0);}
    50% {transform:translateY(-7px) rotate(7deg);}
}

@keyframes shake {
    0%,100% {transform:translateX(0);}
    25% {transform:translateX(-5px);}
    50% {transform:translateX(5px);}
    75% {transform:translateX(-3px);}
}

@keyframes appear {
    from {opacity:0;transform:translateY(8px);}
    to {opacity:1;transform:translateY(0);}
}

.confetti {
    position:fixed;
    top:-15px;
    z-index:10;
    width:8px;
    height:10px;
    pointer-events:none;
    animation:fall 2.5s linear forwards;
}

@keyframes fall {
    to {
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

@media(max-width:400px) {
    .container {padding:24px 17px;}
    .question {font-size:20px;}
}
</style>
</head>

<body>

<div class="decorations">
    <span>✦</span>
    <span>✧</span>
    <span>♡</span>
    <span>✦</span>
    <span>✧</span>
    <span>♡</span>
</div>

<div class="container">

    <div id="quiz">

        <div class="ornament">
            <span>✦</span><i></i><span>♡</span><i></i><span>✦</span>
        </div>

        <h2 class="question" id="question"></h2>

        <div class="answers" id="answers"></div>

        <button class="next" id="next" onclick="nextQuestion()">
            Next →
        </button>

        <div class="ornament bottom">
            <span>✧</span><i></i><span>♡</span><i></i><span>✧</span>
        </div>

    </div>

    <div class="result" id="result">

        <div class="ornament">
            <span>✦</span><i></i><span>♡</span><i></i><span>✦</span>
        </div>

        <h2 id="resultTitle"></h2>

        <button class="next" id="retry" onclick="restartQuiz()">
            Try again →
        </button>

        <div class="ornament bottom">
            <span>✧</span><i></i><span>♡</span><i></i><span>✧</span>
        </div>

    </div>

</div>

<script>

    },

    },
    {

    {

            { text: "الكرامة قيدها في الغياب", correct: false },

    },
    {

    },

        ]
    },
    {
        question: "Instead of zbi we say:",
        answers: [
            { text: "zobwi", correct: true },

        ]
    },
    {
        question: "Instead of kri we say:",
        answers: [
            { text: "Krira", correct: false },

        answers: [

    },
    {
        question: "Lalak hiya.....",
        answers: [

            { text: "riham", correct: false }
        ]
    },
    {
        question: "When someone is a gc's traitor we shall:",
        answers: [
            { text: "نرجمو قحبة مها", correct: true },
            { text: "نحويو طبونها", correct: false },
            { text: "نهدموها بالحرارة", correct: false }
        ]
    },
    {
        question: "When Mbarki is with someone what does he feel like?",
        answers: [
            { text: "Nmla", correct: true },
            { text: "9oziba", correct: false },
            { text: "sli3fana", correct: false }
        ]
    },
    {
        question: "Who was the victim to all the killings in among us?",
        answers: [
            { text: "Arwa", correct: false },
            { text: "luna", correct: false },
            { text: "riham", correct: true }
        ]
    },
    {
        question: "Who always ss into Arwa?",
        answers: [
            { text: "Luna", correct: false },
            { text: "khouloud", correct: true },
            { text: "viper", correct: false }
        ]
    }
];
let current = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const nextBtn = document.getElementById("next");

function shuffle(array) {
    const shuffled = [...array];

    for(let i=shuffled.length-1;i>0;i--) {
        const j = Math.floor(Math.random()*(i+1));
        [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
    }

    return shuffled;
}

function loadQuestion() {
    answered = false;

    const q = questions[current];

    questionEl.textContent = q.question;
    answersEl.innerHTML = "";
    nextBtn.style.display = "none";

    const randomizedAnswers = shuffle(q.answers);

    randomizedAnswers.forEach(answer => {
        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = answer.text;

        button.addEventListener("click",() => {
            checkAnswer(answer,button);
        });

        answersEl.appendChild(button);
    });
}

function checkAnswer(selected,button) {
    if(answered) return;

    answered = true;

    const buttons = answersEl.querySelectorAll(".answer");

    buttons.forEach(btn => btn.disabled = true);

    if(selected.correct) {
        score++;

        button.classList.add("correct");
        button.textContent = "✓ " + selected.text;

        confetti();

    } else {
        button.classList.add("wrong");
        button.textContent = "✕ " + selected.text;

        buttons.forEach(btn => {
            const answer = questions[current].answers.find(
                a => a.text === btn.textContent
            );

            if(answer && answer.correct) {
                btn.classList.add("correct");
            }
        });
    }

    nextBtn.style.display = "block";

    nextBtn.textContent =
        current === questions.length-1 ? "Finish →" : "Next →";
}

function nextQuestion() {
    if(!answered) return;

    current++;

    if(current < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";

    const result = document.getElementById("result");
    const title = document.getElementById("resultTitle");
    const retry = document.getElementById("retry");

    result.style.display = "block";

    const wrong = questions.length-score;

    if(wrong <= 5) {
        title.textContent = "YAYYY GOOD JOB ♡";
        confetti();
        confetti();

        setTimeout(() => {
            window.location.href = "reward.html";
        },2500);

    } else {
        title.textContent = "are u dumb, try again";
        retry.style.display = "block";
    }
}

function restartQuiz() {
    current = 0;
    score = 0;

    document.getElementById("result").style.display = "none";
    document.getElementById("quiz").style.display = "block";
    document.getElementById("retry").style.display = "none";

    loadQuestion();
}

function confetti() {
    const colors = [
        "#b58ae8",
        "#d4b8f5",
        "#9270c7",
        "#f4d7ff",
        "#ffffff"
    ];

    for(let i=0;i<45;i++) {
        const piece = document.createElement("div");

        piece.className = "confetti";
        piece.style.left = Math.random()*100+"vw";
        piece.style.background =
            colors[Math.floor(Math.random()*colors.length)];

        piece.style.animationDuration =
            (1.5+Math.random()*2)+"s";

        piece.style.animationDelay =
            Math.random()*.5+"s";

        document.body.appendChild(piece);

        setTimeout(() => piece.remove(),4000);
    }
}

loadQuestion();
</script>

</body>
</html>
